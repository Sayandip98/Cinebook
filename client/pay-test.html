<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBook payment test (dev only)</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      input, button { display: block; width: 100%; margin: 0.5rem 0; padding: 0.6rem; box-sizing: border-box; }
      pre { background: #f1f5f9; padding: 1rem; overflow: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Payment test (dev only)</h1>
    <input id="token" placeholder="Access token (from login)" />
    <input id="bookingId" placeholder="PENDING booking id" />
    <button id="pay">Create order and pay</button>
    <pre id="out"></pre>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      const API = 'http://localhost:5000/api/v1';
      const out = document.getElementById('out');
      const show = (value) => {
        out.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      };

      const post = async (path, token, body) => {
        const response = await fetch(API + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify(body),
        });
        return { status: response.status, body: await response.json() };
      };

      document.getElementById('pay').onclick = async () => {
        const token = document.getElementById('token').value.trim();
        const bookingId = document.getElementById('bookingId').value.trim();

        const order = await post('/payments/orders', token, { bookingId });
        if (order.status >= 400) return show(order);

        const { keyId, orderId, amount, currency } = order.body.data.order;
        const checkout = new Razorpay({
          key: keyId,
          order_id: orderId,
          amount,
          currency,
          name: 'CineBook',
          handler: async (response) => show(await post('/payments/verify', token, response)),
          modal: { ondismiss: () => show('Checkout closed without paying') },
        });
        checkout.on('payment.failed', (response) => show(response.error));
        checkout.open();
      };
    </script>
  </body>
</html>
